name: ci
on:
  push:
    branches: [main, build]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run size
      - run: npm test
      - run: npx playwright install --with-deps
      - run: npm run test:browser
  node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --input-type=module -e "const m = await import('./dist/hitzones.js'); if (typeof m.createZones !== 'function') process.exit(1)"
